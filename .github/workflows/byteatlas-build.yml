
name: ByteAtlas Build

on:
  push:
    branches:
      - rebrand/byteatlas
  pull_request:
    branches:
      - rebrand/byteatlas

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build
